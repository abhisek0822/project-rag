[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-rag"
version = "0.1.0"
description = "A provider-neutral, self-managed document RAG application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.34,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "openai>=1.66,<3",
  "pgvector>=0.3.6,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "SQLAlchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
